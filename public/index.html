<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QC Banana</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Nano Banana field image generator</p>
          <h1>QC Banana</h1>
        </div>
        <nav class="tabs" aria-label="Application views">
          <button class="tab is-active" data-view="generate" type="button">Generate</button>
          <button class="tab" data-view="admin" type="button">Admin</button>
          <button class="tab" data-view="settings" type="button">Settings</button>
          <button class="tab" data-view="history" type="button">History</button>
        </nav>
      </header>

      <main id="app" class="app" aria-live="polite">
        <section class="empty-state">Loading...</section>
      </main>
    </div>

    <template id="icon-download">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14" /></svg>
    </template>
    <script src="/app.js" type="module"></script>
  </body>
</html>
